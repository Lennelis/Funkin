# Typechecks the game for Android on a GitHub-hosted runner.
#
# The repository's own build-game.yml runs on self-hosted runners with a
# private image, and builds Windows and macOS. This is a smaller thing with a
# different job: prove the source still compiles for the phone, on a runner
# anyone can use, without waiting for a full native build.
#
# It stops at --no-output, so Haxe typechecks everything and then throws the
# C++ away. That needs no NDK and takes minutes rather than the best part of an
# hour, which is what makes it usable as a check on every push.

name: Typecheck the editor app

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'project.hxp'
      - 'hmm.json'
      - '.github/workflows/editor-app.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      # Taken from build/Dockerfile, which is the authoritative list of what
      # this build needs. A shorter guess got as far as compiling lime and
      # then died on dbus/dbus.h.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libc6-dev libffi-dev libdbus-1-dev libudev-dev libgbm-dev \
            libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxss-dev \
            libgl-dev libgl1-mesa-dev libglu1-mesa-dev libdrm-dev \
            libasound2-dev libpulse-dev \
            libvlc-dev libvlccore-dev \
            gcc-multilib g++-multilib \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libpipewire-0.3-dev
          # SDL generates its wayland protocol bindings at build time with
          # wayland-scanner, from the definitions in wayland-protocols. The
          # Dockerfile predates that and lists neither, so nothing generated
          # them and the compile went looking for files that were never
          # written.
          # The same libffi symlink the Dockerfile makes.
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libffi.so.8 \
            /usr/lib/x86_64-linux-gnu/libffi.so.6 || true

      - name: Set up haxelib and hmm
        run: |
          haxelib fixrepo --global || true
          haxelib --debug --never --global install haxelib 4.1.0
          haxelib --global set haxelib 4.1.0
          haxelib --global remove haxelib git || true
          haxelib --global remove hmm || true
          rm -rf .haxelib
          haxelib --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          haxelib --never newrepo
          haxelib version

      - name: Restore dependencies
        id: cache-hmm
        uses: actions/cache/restore@v4
        with:
          path: .haxelib
          key: haxe-hmm-${{ runner.os }}-${{ hashFiles('hmm.json') }}

      - name: Install dependencies
        if: steps.cache-hmm.outputs.cache-hit != 'true'
        run: haxelib --global run hmm install -q

      # lime comes from git here, and a git checkout of lime has no lime.ndll
      # in it — that ships only with its haxelib releases. Every lime command
      # that touches CFFI needs one, so it gets built. This is the slow step,
      # hence the cache; build-game.yml does the same thing for the same
      # reason.
      - name: Restore native tooling
        id: cache-lime
        uses: actions/cache/restore@v4
        with:
          path: |
            .haxelib/lime/git/ndll
            .haxelib/hxcpp/git/bin
          key: haxe-native-linux64-${{ hashFiles('hmm.json') }}

      # Everything below was built on the assumption that lime cannot run at
      # all without its native library, because `lime config` and `lime setup`
      # both died on it. But those touch CFFI; `display` only reads the
      # project file and prints a compiler command line, which may need
      # nothing native at all. If it does not, the whole native build below is
      # unnecessary.
      - name: Try lime without its native tooling
        id: probe
        run: |
          if haxelib run lime display android > probe.hxml 2> probe.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "lime display works with no native tooling"
            head -20 probe.hxml
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "--- why not ---"
            tail -20 probe.log
          fi

      # Both of these come from git, so neither carries the compiled part
      # that its haxelib releases ship, and each in turn comes up and dies on
      # a native library that is not there. hxcpp is the bottom of it, since
      # everything else is built by hxcpp.
      #
      # lime cannot build the library it needs in order to run — every lime
      # command loads CFFI first, `rebuild` included — so this calls what
      # `lime rebuild` would have called. build-game.yml only gets away with
      # going through lime because its cache is never cold.
      - name: Build the native tooling
        if: steps.probe.outputs.ok != 'true' && steps.cache-lime.outputs.cache-hit != 'true'
        run: |
          # haxelib reports the library root for some libraries and its src/
          # directory for others, so look for the file rather than assume.
          find_root() {
            local base
            base=$(haxelib path "$1" | grep -m1 '^/')
            base=${base%/}
            for candidate in "$base" "$(dirname "$base")"; do
              if [ -e "$candidate/$2" ]; then
                echo "$candidate"
                return 0
              fi
            done
            echo "no $2 for $1 under $base" >&2
            ls -la "$base" >&2
            return 1
          }

          hxcpp_root=$(find_root hxcpp project/build.n)
          echo "--- building hxcpp's binaries in $hxcpp_root ---"
          # build.n shells out to the hxcpp tool, which finds its binaries
          # missing and offers to build them. That offer is the only thing
          # that breaks the circle, and there is no terminal here to accept
          # it. No submodule work is needed; this bootstraps itself.
          #
          # Its neko target then fails, and that is fine: what is needed from
          # here is the hxcpp tool and the cpp toolchain, which are built by
          # the time it gets there. lime compiles happily against it.
          (cd "$hxcpp_root/project" && yes | neko build.n) \
            || echo "::warning::hxcpp build.n did not finish; continuing"

          lime_root=$(find_root lime project/Build.xml)

          # SDL writes its wayland protocol sources with wayland-scanner during
          # its own cmake build. lime compiles SDL through hxcpp instead, which
          # never runs that step, so the sources are expected to already exist
          # and nothing has ever written them. Generate them here.
          sdl="$lime_root/project/lib/sdl"
          out="$sdl/wayland-generated-protocols"
          mkdir -p "$out"
          for xml in $(find /usr/share/wayland /usr/share/wayland-protocols \
                            "$sdl/wayland-protocols" -name '*.xml' 2>/dev/null); do
            base=$(basename "$xml" .xml)
            wayland-scanner client-header "$xml" "$out/$base-client-protocol.h" 2>/dev/null || true
            wayland-scanner private-code  "$xml" "$out/$base-client-protocol.c" 2>/dev/null || true
          done
          echo "generated $(ls "$out" | wc -l) wayland protocol files"

          echo "--- building lime.ndll in $lime_root ---"
          (cd "$lime_root/project" && yes | haxelib run hxcpp Build.xml -Dlinux -DHXCPP_M64)

          ls -la "$lime_root/ndll/Linux64"

      - name: Set up lime
        if: steps.probe.outputs.ok != 'true'
        run: |
          haxelib --always run lime setup
          haxelib run lime rebuild hxcpp

      # The runner already has an SDK and NDK, so this points lime at them
      # rather than installing anything.
      - name: Point lime at the runner's Android SDK
        if: steps.probe.outputs.ok != 'true'
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          echo "Using SDK $ANDROID_HOME and NDK $NDK"
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$NDK"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      # assets/ is a submodule of the crew's asset repository, which this
      # token cannot reach and which is 2.5GB besides. A typecheck never reads
      # an asset — only lime's project parsing insists the paths exist — so
      # this puts an empty skeleton where they would be, derived from
      # project.hxp so it stays right as that file changes.
      #
      # Building an actual APK would need the real assets. This is only enough
      # to let Haxe look at the source.
      - name: Stand in for the asset submodule
        run: |
          grep -o 'assets/[A-Za-z0-9_./-]*' project.hxp | sort -u | while read -r path; do
            case "$path" in
              *.*) mkdir -p "$(dirname "$path")"; : > "$path" ;;
              *)   mkdir -p "$path" ;;
            esac
          done
          # A few songs are listed for separate embedding and get their asset
          # path built from that list rather than written out, so grepping for
          # literal paths does not see them.
          sed -n 's/.*EMBED_SONGS_AUDIO[^=]*=[[:space:]]*\[\(.*\)\].*/\1/p' project.hxp \
            | tr ',' '\n' | tr -d ' "' | while read -r song; do
                [ -n "$song" ] && mkdir -p "assets/songs/$song"
              done

          echo "made $(find assets -type d | wc -l) asset directories"

      # Two macros read the assets from disk at compile time, so empty
      # directories are not enough for either: the registries read
      # assets/preload/data, and HaxeUI builds the editors' own components
      # out of the layouts under assets/exclude/data. A layout that is not
      # there fails the build, and a layout that is there but wrong fails it
      # too — which is the point, since that is a class of mistake nothing
      # else here would catch.
      #
      # Only the JSON and XML are needed, not the audio and images, so this
      # takes those two paths out of the assets fork rather than the whole
      # 2.5GB of it.
      - name: Fetch the data the compile-time macros read
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/Lennelis/funkin.assets "$RUNNER_TEMP/assets-src"
          git -C "$RUNNER_TEMP/assets-src" sparse-checkout set preload/data exclude/data
          mkdir -p assets/preload assets/exclude
          cp -r "$RUNNER_TEMP/assets-src/preload/data" assets/preload/
          cp -r "$RUNNER_TEMP/assets-src/exclude/data" assets/exclude/
          echo "$(find assets/preload/data -name '*.json' | wc -l) data files"
          echo "$(find assets/exclude/data -name '*.xml' | wc -l) layouts"

      # Two builds, because which classes exist depends on the define rather
      # than on the command line. project.hxp turns the editors off on mobile
      # unless EDITOR_APP is set, and what that decides is the `include`
      # macros written into the hxml — so passing the define to `haxe`
      # afterwards is far too late. Generated without it, the hxml has no
      # mention of the editors at all and typechecking it says nothing about
      # them, which is how a character editor that does not compile has been
      # passing this check.
      - name: Work out the builds
        run: |
          haxelib run lime display android > build-game.hxml
          haxelib run lime display android -DEDITOR_APP > build-editor.hxml

          echo "--- editors included? ---"
          grep -c 'funkin.ui.debug' build-game.hxml || echo "0 in the game build"
          grep -c 'funkin.ui.debug' build-editor.hxml || echo "0 in the editor build"

      # The macro that builds the scripted classes reports the same failure
      # once per class, so the tail of a failed run is dozens of repetitions
      # and the message that actually explains it is at the top.
      - name: Typecheck
        run: |
          # Without this the compiler colours its output, and every frame
          # line starts with an escape sequence rather than whitespace, which
          # is what defeated the last attempt at filtering these.
          export NO_COLOR=1
          # Twice: once as the game is normally built, and once as the editor
          # app. The second is not redundant — the hub is only reachable under
          # that define, so nothing would compile it otherwise.
          # The exporters are not referenced from anywhere yet, so nothing
          # would compile them and a clean run would mean nothing about them.
          include="--macro include('funkin.data.song.exporter')"
          if haxe build-game.hxml $include --no-output > typecheck.log 2>&1 \
             && haxe build-editor.hxml $include --no-output >> typecheck.log 2>&1; then
            echo "typechecked clean, both as the game and as the editor app"
          else
            # The whole log is one macro failure reported per scripted class,
            # so both ends of it are call frames. Strip the frames, the echoed
            # source lines and the carets, and what is left is the message.
            echo "--- messages ---"
            sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' typecheck.log \
              | grep -vE 'Called from here|^[[:space:]]*$|^[[:space:]]*[0-9]+ \||^[[:space:]]*\|[[:space:]]*\^+[[:space:]]*$|^[[:space:]]*->' \
              | head -40
            echo "--- ($(wc -l < typecheck.log) lines total) ---"
            exit 1
          fi

      - name: Save dependencies
        if: always() && steps.cache-hmm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .haxelib
          key: haxe-hmm-${{ runner.os }}-${{ hashFiles('hmm.json') }}

      - name: Save native tooling
        if: always() && steps.cache-lime.outputs.cache-hit != 'true' && hashFiles('.haxelib/lime/git/ndll/Linux64/lime.ndll') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .haxelib/lime/git/ndll
            .haxelib/hxcpp/git/bin
          key: haxe-native-linux64-${{ hashFiles('hmm.json') }}

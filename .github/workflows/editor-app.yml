# Typechecks the game for Android on a GitHub-hosted runner.
#
# The repository's own build-game.yml runs on self-hosted runners with a
# private image, and builds Windows and macOS. This is a smaller thing with a
# different job: prove the source still compiles for the phone, on a runner
# anyone can use, without waiting for a full native build.
#
# It stops at --no-output, so Haxe typechecks everything and then throws the
# C++ away. That needs no NDK and takes minutes rather than the best part of an
# hour, which is what makes it usable as a check on every push.

name: Typecheck the editor app

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'project.hxp'
      - 'hmm.json'
      - '.github/workflows/editor-app.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      # What lime needs to build its own native tooling below.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ \
            libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev \
            libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev

      # The game needs the crew's forks of both haxelib and hmm; the stock
      # ones cannot install this dependency set.
      - name: Set up haxelib and hmm
        run: |
          haxelib fixrepo --global || true
          haxelib --debug --never --global install haxelib 4.1.0
          haxelib --global set haxelib 4.1.0
          haxelib --global remove haxelib git || true
          haxelib --global remove hmm || true
          rm -rf .haxelib
          haxelib --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          haxelib --never newrepo
          haxelib version

      - name: Restore dependencies
        id: cache-hmm
        uses: actions/cache/restore@v4
        with:
          path: .haxelib
          key: haxe-hmm-${{ runner.os }}-${{ hashFiles('hmm.json') }}

      - name: Install dependencies
        if: steps.cache-hmm.outputs.cache-hit != 'true'
        run: haxelib --global run hmm install -q

      # lime comes from git here, and a git checkout of lime has no lime.ndll
      # in it — that ships only with its haxelib releases. Every lime command
      # that touches CFFI needs one, so it gets built. This is the slow step,
      # hence the cache; build-game.yml does the same thing for the same
      # reason.
      - name: Restore native tooling
        id: cache-lime
        uses: actions/cache/restore@v4
        with:
          path: |
            .haxelib/lime/git/ndll
            .haxelib/hxcpp/git/bin
          key: haxe-native-linux64-${{ hashFiles('hmm.json') }}

      # lime's native code lives in submodules of its own repository, and
      # installing it from git does not bring them along. Rebuilding without
      # them cannot work, whatever else is wrong.
      - name: Fetch lime's submodules
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: git -C .haxelib/lime/git submodule update --init --recursive

      # Both of these come from git, so neither carries the compiled part
      # that its haxelib releases ship, and each in turn comes up and dies on
      # a native library that is not there. hxcpp is the bottom of it, since
      # everything else is built by hxcpp.
      #
      # lime cannot build the library it needs in order to run — every lime
      # command loads CFFI first, `rebuild` included — so this calls what
      # `lime rebuild` would have called. build-game.yml only gets away with
      # going through lime because its cache is never cold.
      - name: Build the native tooling
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: |
          # haxelib reports the library root for some libraries and its src/
          # directory for others, so look for the file rather than assume.
          find_root() {
            local base
            base=$(haxelib path "$1" | grep -m1 '^/')
            base=${base%/}
            for candidate in "$base" "$(dirname "$base")"; do
              if [ -e "$candidate/$2" ]; then
                echo "$candidate"
                return 0
              fi
            done
            echo "no $2 for $1 under $base" >&2
            ls -la "$base" >&2
            return 1
          }

          hxcpp_root=$(find_root hxcpp project/build.n)
          echo "--- building hxcpp's binaries in $hxcpp_root ---"
          # build.n shells out to the hxcpp tool, which finds its binaries
          # missing and offers to build them. That offer is the only thing
          # that breaks the circle — build.n needs the tool, the tool needs
          # what build.n makes — and there is no terminal here to accept it.
          (cd "$hxcpp_root/project" && yes | neko build.n)

          lime_root=$(find_root lime project/Build.xml)
          echo "--- building lime.ndll in $lime_root ---"
          (cd "$lime_root/project" && yes | haxelib run hxcpp Build.xml -Dlinux -DHXCPP_M64)

          ls -la "$lime_root/ndll/Linux64"

      - name: Set up lime
        run: |
          haxelib --always run lime setup
          haxelib run lime rebuild hxcpp

      # The runner already has an SDK and NDK, so this points lime at them
      # rather than installing anything.
      - name: Point lime at the runner's Android SDK
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          echo "Using SDK $ANDROID_HOME and NDK $NDK"
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$NDK"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Work out the build
        run: |
          haxelib run lime display android > build.hxml
          echo "--- build.hxml ---"
          head -40 build.hxml

      - name: Typecheck
        run: haxe build.hxml --no-output

      - name: Save dependencies
        if: always() && steps.cache-hmm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .haxelib
          key: haxe-hmm-${{ runner.os }}-${{ hashFiles('hmm.json') }}

      - name: Save native tooling
        if: always() && steps.cache-lime.outputs.cache-hit != 'true' && hashFiles('.haxelib/lime/git/ndll/Linux64/lime.ndll') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .haxelib/lime/git/ndll
            .haxelib/hxcpp/git/bin
          key: haxe-native-linux64-${{ hashFiles('hmm.json') }}

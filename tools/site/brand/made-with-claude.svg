<svg xmlns="http://www.w3.org/2000/svg" width="208" height="48" viewBox="0 0 208 48" role="img" aria-label="Made with Claude">
  <title>Made with Claude</title>
  <style>
    .plate { fill: #1D1930; stroke: #3A3157; }
    .mark  { fill: #FF4FA3; }
    .kicker{ fill: #ADA2C6; }
    .word  { fill: #EFEAF7; }
    @media (prefers-color-scheme: light) {
      .plate { fill: #FFFFFF; stroke: #DCD4E8; }
      .mark  { fill: #D5187A; }
      .kicker{ fill: #635979; }
      .word  { fill: #1B1526; }
    }
  </style>
  <rect class="plate" x="0.75" y="0.75" width="206.5" height="46.5" rx="13" stroke-width="1.5"/>
  <g class="mark" transform="translate(28 24)">
    <g>
      <rect x="-2.1" y="-13" width="4.2" height="26" rx="2.1"/>
      <rect x="-2.1" y="-13" width="4.2" height="26" rx="2.1" transform="rotate(60)"/>
      <rect x="-2.1" y="-13" width="4.2" height="26" rx="2.1" transform="rotate(120)"/>
    </g>
  </g>
  <text class="kicker" x="53" y="19" font-family="Trebuchet MS, Verdana, Geneva, sans-serif" font-size="9" font-weight="700" letter-spacing="1.9">MADE WITH</text>
  <text class="word" x="53" y="36" font-family="Trebuchet MS, Verdana, Geneva, sans-serif" font-size="17" font-weight="700" letter-spacing="0.6">CLAUDE</text>
</svg>
